services:
  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.stockwhisk.com
    domainname: stockwhisk.com
    env_file: .env
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - ./mail-data/:/var/mail/
      - ./mail-state/:/var/mail-state/
      - ./mail-logs/:/var/log/mail/
      - ./config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE

  mail_db:
    image: mariadb:10.5
    container_name: mail_db
    restart: always
    command: --max_allowed_packet=64M
    environment:
      - MYSQL_ROOT_PASSWORD=roundcube_root_secret
      - MYSQL_DATABASE=roundcube
      - MYSQL_USER=roundcube
      - MYSQL_PASSWORD=roundcube_secret
    volumes:
      - ./mail-db-data/:/var/lib/mysql

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: always
    # No longer exposed directly - accessed via nginx reverse proxy
    expose:
      - "80"
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=mysql
      - ROUNDCUBEMAIL_DB_HOST=mail_db
      - ROUNDCUBEMAIL_DB_USER=roundcube
      - ROUNDCUBEMAIL_DB_PASSWORD=roundcube_secret
      - ROUNDCUBEMAIL_DB_NAME=roundcube
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_SMTP_USER=
      - ROUNDCUBEMAIL_SMTP_PASSWORD=
      - ROUNDCUBEMAIL_DES_KEY=stockwhisk_secret_key_1234567890
    volumes:
      - ./roundcube-data/:/var/roundcube/db/
    depends_on:
      - mailserver
      - mail_db

  # Nginx reverse proxy with SSL
  mail_nginx:
    image: nginx:alpine
    container_name: mail_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mail.conf:/etc/nginx/conf.d/mail.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - roundcube

  # Certbot for automatic SSL certificate management
  certbot:
    image: certbot/certbot:latest
    container_name: mail_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Run once to issue cert, then handled by cron
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

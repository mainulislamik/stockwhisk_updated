services:
  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.stockwhisk.com
    domainname: stockwhisk.com
    env_file: .env
    environment:
      # Enable TLS so submission (587) offers STARTTLS + AUTH. Uses a self-signed
      # cert (fine for internal backend->mailserver; Django does not verify it).
      # Generate the cert once on the host (see setup notes), then recreate.
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/tmp/docker-mailserver/ssl/mail.stockwhisk.com-cert.pem
      - SSL_KEY_PATH=/tmp/docker-mailserver/ssl/mail.stockwhisk.com-key.pem
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - ./mail-data/:/var/mail/
      - ./mail-state/:/var/mail-state/
      - ./mail-logs/:/var/log/mail/
      - ./config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    networks:
      - mailnet
      - stockwhisk_updated_default

  mail_db:
    image: mariadb:10.5
    container_name: mail_db
    restart: always
    command: --max_allowed_packet=64M
    environment:
      - MYSQL_ROOT_PASSWORD=roundcube_root_secret
      - MYSQL_DATABASE=roundcube
      - MYSQL_USER=roundcube
      - MYSQL_PASSWORD=roundcube_secret
    volumes:
      - ./mail-db-data/:/var/lib/mysql
    networks:
      - mailnet

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    restart: always
    expose:
      - "80"
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=mysql
      - ROUNDCUBEMAIL_DB_HOST=mail_db
      - ROUNDCUBEMAIL_DB_USER=roundcube
      - ROUNDCUBEMAIL_DB_PASSWORD=roundcube_secret
      - ROUNDCUBEMAIL_DB_NAME=roundcube
      # Dovecot enforces TLS (ssl = required) once SSL_TYPE is set, so connect
      # over TLS. Self-signed cert is trusted via imap_conn_options in custom.inc.php.
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mailserver
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_SMTP_USER=
      - ROUNDCUBEMAIL_SMTP_PASSWORD=
      - ROUNDCUBEMAIL_DES_KEY=stockwhisk_secret_key_1234567890
    volumes:
      - ./roundcube-data/:/var/roundcube/db/
      # Mount as config.inc.php (which Roundcube loads) — it re-includes the
      # env-generated config.docker.inc.php, then adds our overrides.
      - ./roundcube-config/custom.inc.php:/var/www/html/config/config.inc.php:ro
    depends_on:
      - mailserver
      - mail_db
    networks:
      - mailnet
      - stockwhisk_updated_default

networks:
  mailnet:
    driver: bridge
  stockwhisk_updated_default:
    external: true

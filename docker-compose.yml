# StockWhisk — full stack: Django REST backend + Next.js frontend.
# One command:  docker compose up -d --build
# Frontend:  http://localhost:3000     Backend API/docs:  http://localhost:8000/api/docs/

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=128MB -c work_mem=4MB -c maintenance_work_mem=16MB
    environment:
      POSTGRES_DB: stockwhisk
      POSTGRES_USER: stockwhisk
      POSTGRES_PASSWORD: stockwhisk_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwhisk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build: ./backend
    command: ["gunicorn", "-c", "deploy/gunicorn.conf.py", "config.wsgi:application"]
    environment:
      TZ: "Asia/Dhaka"
      GUNICORN_BIND: "0.0.0.0:8000"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: stockwhisk
      DB_USER: stockwhisk
      DB_PASSWORD: stockwhisk_password
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:-django-insecure-default-key-for-zero-config}"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "https://stockwhisk.com,http://localhost:3000,http://localhost:3333,http://127.0.0.1:3000,http://127.0.0.1:3333,http://localhost:8000"
      CORS_ALLOW_ALL_ORIGINS: "True"
      SECURE_SSL_REDIRECT: "False"
      WEB_CONCURRENCY: "1"
      GUNICORN_THREADS: "2"
      DB_CONN_MAX_AGE: "600"
      EMAIL_HOST: "mailserver"
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "True"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-no-reply@stockwhisk.com}"
      MAILSERVER_CONFIG_DIR: "/app/mailserver-config"
    ports:
      - "8000:8000"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - ./mailserver/config:/app/mailserver-config
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    build: ./backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=1", "--max-tasks-per-child=50"]
    environment:
      TZ: "Asia/Dhaka"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: stockwhisk
      DB_USER: stockwhisk
      DB_PASSWORD: stockwhisk_password
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:-django-insecure-default-key-for-zero-config}"
      DEBUG: "False"
      DB_CONN_MAX_AGE: "600"
      EMAIL_HOST: "mailserver"
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "True"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-no-reply@stockwhisk.com}"
      MAILSERVER_CONFIG_DIR: "/app/mailserver-config"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - media:/app/media
      - ./mailserver/config:/app/mailserver-config
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  beat:
    build: ./backend
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      TZ: "Asia/Dhaka"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: stockwhisk
      DB_USER: stockwhisk
      DB_PASSWORD: stockwhisk_password
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:-django-insecure-default-key-for-zero-config}"
      DEBUG: "False"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - media:/app/media
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      args:
        # Backend origin the browser calls directly (CORS is enabled on the
        # backend). Inlined into the client bundle at build time. Override this
        # if you serve the backend on a different host/port than localhost:8000.
        NEXT_PUBLIC_API_BASE: ""
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static:/app/staticfiles
      - media:/app/media
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  redisdata:
  static:
  media:
  caddy_data:
  caddy_config:

networks:
  default:
    name: stockwhisk_updated_default

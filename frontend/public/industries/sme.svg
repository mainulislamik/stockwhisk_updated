<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="400" height="230" fill="url(#bg5)"/>
  <circle cx="330" cy="56" r="30" fill="#fde68a" opacity="0.8"/>
  <rect x="60" y="188" width="280" height="12" rx="4" fill="#e7e5e4"/>
  <!-- big open box -->
  <path d="M120 96 l80 -24 80 24 -80 22 z" fill="#fbbf24"/>
  <path d="M120 96 v70 l80 22 v-70 z" fill="url(#box1)"/>
  <path d="M280 96 v70 l-80 22 v-70 z" fill="#b45309"/>
  <path d="M120 96 l80 22 v-16 l-80 -22 z" fill="#fcd34d"/><path d="M280 96 l-80 22 v-16 l80 -22 z" fill="#f59e0b"/>

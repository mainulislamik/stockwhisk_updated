  <!-- shipping label -->
  <rect x="300" y="120" width="60" height="46" rx="4" fill="#ffffff" stroke="#cbd5e1" transform="rotate(6 330 143)"/>
  <g transform="rotate(6 330 143)"><rect x="308" y="128" width="30" height="5" rx="2" fill="#94a3b8"/><rect x="308" y="138" width="44" height="4" rx="2" fill="#cbd5e1"/><g fill="#334155"><rect x="308" y="148" width="3" height="12"/><rect x="314" y="148" width="2" height="12"/><rect x="319" y="148" width="4" height="12"/><rect x="326" y="148" width="2" height="12"/><rect x="331" y="148" width="3" height="12"/><rect x="338" y="148" width="2" height="12"/><rect x="343" y="148" width="4" height="12"/></g></g>
</svg>
